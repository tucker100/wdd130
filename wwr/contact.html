<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Tucker Rafting</title>
    <meta name="description"
      content="Contact Tucker Rafting to ask a question, plan a whitewater trip, or reach our team by phone, email, or in person at our river office.">
    <meta name="author" content="McMavin Tucker">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Tucker Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Tucker Rafting</h1>
            <address>
                No 12 Omarikevwe Street Ogiyede Rd Off Ogunu<br>
                Warri, Delta<br>
                <a href="tel:+2348112861256">+234 811 286 1256</a><br>
                <a href="mailto:info@tuckerrafting.com">info@tuckerrafting.com</a>
            </address>
        </section>

        <div class="contact-grid">
            <iframe class="map"
              src="https://www.google.com/maps?q=federal+government+college+warri&amp;output=embed"
              title="Map showing the location of Tucker Rafting"
              allowfullscreen loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form class="contact-form" action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <div class="options">
                        <div class="choice">
                            <input type="radio" id="general" name="purpose" value="general" required>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="choice">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="choice">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here" required></textarea>

                <div class="choice">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of Toju Awala-la, Head River Guide">
                    <figcaption>Toju Awala-la<br>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of Tunji Adedotun, Safety Director">
                    <figcaption>Tunji Adedotun<br>Safety Director</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of Emeka Okafor, Reservations Manager">
                    <figcaption>Emeka Okafor<br>Reservations Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 Tucker Rafting | McMavin Tucker</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Tucker Rafting on Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.svg" alt="Tucker Rafting on LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Tucker Rafting on Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
